cargo-features = ["codegen-backend"]

[package]
name = "obayebar"
version = "0.1.0"
edition = "2021"
description = "Wayland status bar inspired by caelestia-shell"
license = "MIT"
repository = "https://github.com/obayemi/obayebar"
readme = "README.md"
keywords = ["wayland", "bar", "status-bar", "hyprland"]
categories = ["gui"]
default-run = "obayebar"

[lib]
name = "obayebar"
path = "src/lib.rs"

[[bin]]
name = "obayebar"
path = "src/main.rs"

[[bin]]
name = "obayebar-launcher"
path = "src/bin/launcher.rs"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "crisp", "linux-theme-detection", "wayland", "tokio", "canvas", "image-without-codecs", "lazy"] }
iced_layershell = "0.19.1"
iced_runtime = "0.14.0"
tokio = { version = "1.53.1", features = ["full"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
log = "0.4.34"
env_logger = "0.11.11"
async-channel = "2.5.0"
ab_glyph = "0.2"
pipewire = "0.10.1"
wayland-backend = { version = "0.3", features = ["log"] }
tokio-stream = "0.1.19"
nvml-wrapper = "0.12.1"
fontdb = "0.24.0"
fuzzy-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
resvg = "0.48.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "gzip", "query"] }
# reqwest 0.13 ships only the aws-lc-rs crypto provider, which needs cmake and a
# vendored C crypto library at build time. Take the provider-less feature and
# install ring ourselves so the build stays pure-Rust. Note that 0.13 also drops
# the bundled webpki-roots in favour of rustls-platform-verifier, so TLS trust
# now comes from the system store (/etc/ssl/certs) — a self-hosted GitLab behind
# a private CA validates without extra config.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2.0"
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
# transitive dependency version conflicts are not fixable in our code
multiple_crate_versions = "allow"

[profile.dev]
codegen-backend = "cranelift"
