cargo-features = ["codegen-backend"]

[workspace]
resolver = "2"
members = [
    "crates/obayebar-core",
    "crates/obayebar",
    "crates/obayebar-wallpaper",
]
# No `default-members`: it would narrow bare `cargo build`/`cargo test` to the
# listed crates, which is the opposite of what this repo wants — every member
# must build and every member's tests must run by default. `default-run` on the
# bar is what keeps a bare `cargo run` meaningful.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/obayemi/obayebar"
readme = "README.md"
keywords = ["wayland", "bar", "status-bar", "hyprland"]
categories = ["gui"]

[workspace.dependencies]
# default-features off at the root so members opt in explicitly; the small
# binaries take neither tokio nor the image decoders.
obayebar-core = { path = "crates/obayebar-core", default-features = false }

iced = { version = "0.14.0", default-features = false, features = ["wgpu", "crisp", "linux-theme-detection", "wayland", "tokio", "canvas", "image-without-codecs", "lazy"] }
iced_layershell = "0.19.1"
iced_runtime = "0.14.0"
tokio = { version = "1.53.1", features = ["full"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
log = "0.4.34"
env_logger = "0.11.11"
async-channel = "2.5.0"
ab_glyph = "0.2"
pipewire = "0.10.1"
wayland-backend = { version = "0.3", features = ["log"] }
tokio-stream = "0.1.19"
nvml-wrapper = "0.12.1"
fontdb = "0.24.0"
fuzzy-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
resvg = "0.48.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "gzip", "query"] }
# reqwest 0.13 ships only the aws-lc-rs crypto provider, which needs cmake and a
# vendored C crypto library at build time. Take the provider-less feature and
# install ring ourselves so the build stays pure-Rust. Note that 0.13 also drops
# the bundled webpki-roots in favour of rustls-platform-verifier, so TLS trust
# now comes from the system store (/etc/ssl/certs) — a self-hosted GitLab behind
# a private CA validates without extra config.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2.0"
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

# The wallpaper renderer talks wlr-layer-shell directly rather than through
# iced. smithay-client-toolkit's `create_layer_surface` takes a `wl_output`
# *object*, so a wallpaper cannot land on the wrong monitor — the whole class of
# bug the bar's namespace-verification reconciler exists to catch is impossible
# by construction. It also keeps iced, wgpu and their ~100MB of VRAM out of a
# process that draws a static picture.
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
# transitive dependency version conflicts are not fixable in our code
multiple_crate_versions = "allow"

# Must stay at the workspace root: cargo ignores `[profile.*]` in a member and
# only warns, so a copy in a member would silently lose cranelift.
[profile.dev]
codegen-backend = "cranelift"
