[package]
name = "obayebar"
description = "Wayland status bar inspired by caelestia-shell"
default-run = "obayebar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "obayebar"
path = "src/lib.rs"

[[bin]]
name = "obayebar"
path = "src/main.rs"

[dependencies]
obayebar-core = { workspace = true, features = ["async", "images"] }
iced.workspace = true
iced_layershell.workspace = true
iced_runtime.workspace = true
tokio.workspace = true
zbus.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
futures-util.workspace = true
log.workspace = true
env_logger.workspace = true
async-channel.workspace = true
ab_glyph.workspace = true
pipewire.workspace = true
wayland-backend.workspace = true
tokio-stream.workspace = true
nvml-wrapper.workspace = true
fontdb.workspace = true
fuzzy-matcher.workspace = true
freedesktop-desktop-entry.workspace = true
freedesktop-icons.workspace = true
inotify.workspace = true
image.workspace = true
resvg.workspace = true
reqwest.workspace = true
rustls.workspace = true
secret-service.workspace = true
thiserror.workspace = true

[lints]
workspace = true

# Only the config-precedence tests parse TOML directly; the schema and its
# parsing live in obayebar-core.
[dev-dependencies]
toml.workspace = true
