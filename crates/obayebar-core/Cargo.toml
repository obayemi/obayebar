[package]
name = "obayebar-core"
description = "Shared, iced-free helpers: monitor detection, wallpaper selection, config, control sockets, process spawning"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Both features are on by default for the bar's benefit and turned off by the
# small binaries. `async` drags in the whole tokio runtime, which a one-shot
# that makes a single IPC request and exits has no use for; `images` pulls the
# decoders, which only something that actually draws a wallpaper needs.
[features]
default = ["async", "images"]
async = ["dep:tokio"]
images = ["dep:image"]

# Deliberately no iced, no wgpu, no GUI stack. That is the whole point of the
# boundary: obayebar-lock stays a small binary with no GUI toolkit and no
# async runtime, its only Wayland contact a blocking wayland-client roundtrip
# for the Hyprland lock notifier, while the wallpaper renderer drives
# wlr-layer-shell through smithay-client-toolkit, with no iced or wgpu of its
# own.
[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true
thiserror.workspace = true
dirs.workspace = true
image = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
